<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catppuccin Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1 class="title">TETRIS</h1>

  <div class="app-container">
    <!-- 게임 오버 모달 (초기엔 숨김 처리) -->
    <div id="game-over-modal" class="hidden">
      <h2>GAME OVER</h2>
      <div class="score-display">
        <p>SCORE: <span id="modal-score">0</span></p>
        <p class="high-score">HIGH SCORE: <span id="modal-highscore">0</span></p>
      </div>
      <button id="restart-btn">다시하기</button>
    </div>

    <div class="game-area">
      <canvas id="tetris" width="300" height="600"></canvas>
    </div>

    <div class="side-panel">
      <div class="info-box">
        <h2>NEXT</h2>
        <canvas id="next-block" width="120" height="120"></canvas>
      </div>
      <div class="info-box">
        <h2>SCORE</h2>
        <span id="score">0</span>
      </div>
    </div>
  </div>
  <script src="tetris.js"></script>
</body>

</html>
